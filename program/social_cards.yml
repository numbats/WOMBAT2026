# Details for the social media cards (program/social_cards.R) that aren't in
# the pretalx data. Everything here is optional: a session without an entry
# gets the default kind ("Tutorial" on day 1, "Talk" on day 2), its pretalx
# title and speakers in pretalx order; a speaker without an entry gets no role.

# Short label shown in the orange line above the title.
kinds:
  tutorials: Tutorial
  workshops: Talk

sessions:
  DSBAZG:
    kind: Keynote
  GVZ9AP:
    kind: In conversation
    # The pretalx title repeats the speakers' names, which the card already shows.
    title: Analysis Workflows
    # Left to right, top row first. The host always goes in the bottom hexagon.
    order: [UZXXFD, NFDCVB, N8BLXD]
    host: N8BLXD
  LDBUTX:
    kind: Showcase
  TDDWAC:
    kind: Showcase
  MNFGHE:
    kind: Showcase
  XMNJDY:
    kind: Workshop
  9BLXET:
    kind: Workshop

# Keyed by pretalx speaker code. `position` is the photo's crop focus as
# "x% y%" (CSS object-position), defaulting to "50% 35%".
speakers:
