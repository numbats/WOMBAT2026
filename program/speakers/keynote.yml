- name: Rob J Hyndman
  bio: |
    Rob J Hyndman holds the position of Vice-Chancellor’s Distinguished Professor of Statistics at Monash University and an internationally recognised expert in time series forecasting. He is a prolific writer, with more than 200 research papers and five books in statistical science, and has won awards for his research, teaching, consulting, and graduate supervision. His commitment to open research and teaching with open-source statistical software and online learning materials has had a major impact on the accessibility and practice of forecasting.
